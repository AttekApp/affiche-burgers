<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ouverture prochaine — Burger's</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  /* Secours si JavaScript indisponible : image centrée, sans déformation */
  .fallback { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<noscript>
  <picture>
    <source media="(orientation: portrait)" srcset="portrait.jpg">
    <img class="fallback" src="paysage.jpg" alt="Ouverture prochaine de votre restaurant Burger's">
  </picture>
</noscript>
<script>
/* Affiche plein écran pour écrans d'affichage (Samsung Tizen, navigateurs anciens : ES5 uniquement).
   - choisit portrait.jpg ou paysage.jpg selon l'orientation réelle de l'écran ;
   - redimensionne sans déformer ni rogner ;
   - remplit les bandes restantes en prolongeant les bords de l'image (pas de bandes noires) ;
   - se recharge toutes les 6 h pour prendre une éventuelle nouvelle version, seulement si le site répond. */
(function () {
  var VERSION = '1';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var images = {};

  function load(name, cb) {
    if (images[name]) { if (images[name].complete && images[name].naturalWidth) cb(images[name]); return; }
    var img = new Image();
    img.onload = function () { cb(img); };
    img.onerror = function () { setTimeout(function () { images[name] = null; load(name, cb); }, 30000); };
    img.src = name + '?v=' + VERSION;
    images[name] = img;
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var W = canvas.width, H = canvas.height;

    load(H > W ? 'portrait.jpg' : 'paysage.jpg', function (img) {
      if (canvas.width !== W || canvas.height !== H) return; // un redimensionnement a eu lieu entre-temps
      var bw = img.naturalWidth, bh = img.naturalHeight;
      var s = Math.min(W / bw, H / bh);
      var dw = bw * s, dh = bh * s;
      var left = (W - dw) / 2, top = (H - dh) / 2;
      ctx.imageSmoothingEnabled = true;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      if (left > 0.5) { // bandes latérales : première / dernière colonne étirée
        ctx.drawImage(img, 0, 0, 1, bh, 0, top, left + 1, dh);
        ctx.drawImage(img, bw - 1, 0, 1, bh, left + dw - 1, top, W - (left + dw) + 1, dh);
      }
      if (top > 0.5) { // bandes haut / bas : première / dernière ligne étirée
        ctx.drawImage(img, 0, 0, bw, 1, left, 0, dw, top + 1);
        ctx.drawImage(img, 0, bh - 1, bw, 1, left, top + dh - 1, dw, H - (top + dh) + 1);
      }
      ctx.drawImage(img, left, top, dw, dh);
    });
  }

  var t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 150); });
  window.addEventListener('orientationchange', function () { clearTimeout(t); t = setTimeout(draw, 300); });
  draw();

  // Rechargement périodique, uniquement si le site est joignable (sinon on garde l'image affichée).
  setInterval(function () {
    var x = new XMLHttpRequest();
    x.open('GET', 'index.html?check=' + new Date().getTime(), true);
    x.onload = function () { if (x.status === 200) window.location.reload(); };
    x.send();
  }, 6 * 3600 * 1000);
})();
</script>
</body>
</html>
